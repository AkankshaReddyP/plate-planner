name: Deploy Plate Planner to Firebase Hosting
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: "AIzaSyDijl30Ce3vgZyKqaEjvk50n8kT9-Ho3Cw"
      VITE_FIREBASE_AUTH_DOMAIN: "plate-planner-2bc28.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: "plate-planner-2bc28"
      VITE_FIREBASE_APP_ID: "1:395839437565:web:b610dc3bf6a83839c15c94"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Firebase deployment credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLATE_PLANNER_2BC28 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing GitHub Actions secret FIREBASE_SERVICE_ACCOUNT_PLATE_PLANNER_2BC28"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Firestore rules test dependency
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing
      - name: Test security rules before deploying
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-plate-planner "node --test tests/firestore.rules.test.mjs"
      - name: Authorize Firestore Rules deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLATE_PLANNER_2BC28 }}
      - name: Deploy tested Firestore security rules
        run: npx --yes firebase-tools deploy --only firestore:rules --project plate-planner-2bc28 --non-interactive
      - name: Deploy Hosting after rules succeed
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLATE_PLANNER_2BC28 }}
          projectId: plate-planner-2bc28
          channelId: live
